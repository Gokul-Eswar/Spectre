name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      plugins: ${{ steps.filter.outputs.plugins }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            python:
              - 'analyzer/**'
              - '.github/workflows/ci.yml'
            plugins:
              - 'plugins/**'
              - 'scripts/validate_plugins.py'
              - '.github/workflows/ci.yml'
            config:
              - 'configs/**'
              - 'scripts/validate_configs.py'
              - '.github/workflows/ci.yml'

  go-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod download

      - name: Setup Chrome for screenshot tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Export and verify Chrome path
        run: |
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -z "$CHROME_PATH" ] || [ ! -x "$CHROME_PATH" ]; then
            CHROME_PATH=$(command -v google-chrome || command -v chromium-browser || command -v chromium || echo "")
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Resolved Chrome binary: $CHROME_PATH"
          if [ -n "$CHROME_PATH" ]; then
            "$CHROME_PATH" --version
          fi

      - name: Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true # Don't block entirely if linter has minor issues, but report them

      - name: Test with Coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Check coverage gate
        run: go run ./scripts/check_coverage.go -profile coverage.out -min 35

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build CLI binary
        run: go build -o ./bin/spectre ./cmd/spectre

      - name: Startup performance benchmark
        run: |
          go run ./scripts/startup_perf -binary ./bin/spectre -runs 20 -json-out startup_perf.json

      - name: Upload startup benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: startup-performance
          path: startup_perf.json

  python-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.python == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'analyzer/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analyzer/requirements.txt pytest-cov black flake8

      - name: Format Python code with Black
        run: black analyzer/

      - name: Run Flake8 linter
        run: flake8 analyzer/ --max-line-length 100 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest
        run: pytest analyzer/ --cov=analyzer --cov-report=xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  plugin-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.plugins == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Plugin Manifests
        run: python scripts/validate_plugins.py

  config-validation:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Configurations
        run: python scripts/validate_configs.py