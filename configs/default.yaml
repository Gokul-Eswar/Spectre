collectors:
    dns:
        enabled: true
        rate_limit: 10
    geo:
        enabled: true
        rate_limit: 0.75
    github:
        enabled: true
        rate_limit: 2
    ports:
        custom_ports: []
        enabled: true
        mode: default
        rate_limit: 0.2
    whois:
        enabled: true
        rate_limit: 1
database:
    dsn: host=localhost port=5432 user=spectre password=spectre dbname=spectre sslmode=disable
    max_idle_conns: 5
    max_open_conns: 25
    path: spectre.db
    type: sqlite
ethics:
    blacklist:
        - .gov
        - .mil
        - localhost
        - 127.0.0.1
    whitelist: []
extension_registry_url: file://registry_sample.json
ghost_mode: false
http:
    insecure_skip_verify: false
    proxy: ""
    strict: false
    tor_proxy: socks5://127.0.0.1:9050
llm:
    api_key: ""
    max_tokens: 4096
    model: llama3
    provider: ollama
    temperature: 0.7
    timeout: 120
    url: http://localhost:11434
logging:
    format: text
    level: info
server:
    api_key: ""
    cors_allowed_origins:
        - '*'
    port: 8080
