[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-analyzer"
version = "0.1.0"
description = "SPECTRE Python Analyzer"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "rich",
    "pyvis",
    "networkx",
    "requests",
    "jinja2",
    "chromadb",
    "sentence-transformers",
]
